<!DOCTYPE html>
<html lang="id" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login Monitoring PKL - SMK Negeri 1 Klaten</title>

  <!-- KONFIGURASI PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PKL DKV">
  <link rel="apple-touch-icon" href="logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-login-card {
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    body {
      overflow: hidden;
      height: 100dvh;
      touch-action: none;
    }
    html.dark body { background-color: #0f172a; color: #f1f5f9; }
    html.dark .bg-white { background-color: #1e293b !important; color: #f1f5f9; }
    html.dark .text-slate-800 { color: #f8fafc !important; }
    html.dark .text-slate-600 { color: #cbd5e1 !important; }
    html.dark .border-slate-200, html.dark .border-slate-300, html.dark .border-slate-100 { border-color: #334155 !important; }
    html.dark input {
      background-color: #0f172a !important;
      color: #f8fafc !important;
      border-color: #475569 !important;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

  <main class="w-full h-[100dvh] flex items-center justify-center p-5 bg-gradient-to-br from-slate-100 via-indigo-50/50 to-blue-100/60 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950 select-none relative">
    
    <button onclick="toggleDarkMode()" class="absolute top-5 right-5 p-2.5 rounded-2xl bg-white dark:bg-slate-800 shadow-md border border-slate-200 dark:border-slate-700 text-xs font-bold flex items-center gap-1.5">
      <span id="iconDarkLogin">🌙</span> <span id="txtDarkLogin" class="text-slate-700 dark:text-slate-200">Mode Gelap</span>
    </button>

    <div class="w-full max-w-sm bg-white p-6 rounded-3xl shadow-xl border border-slate-200/80 animate-login-card">
      <div class="text-center mb-5">
        <img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135755.png'" alt="Logo Sekolah" class="w-20 h-20 mx-auto mb-2.5 object-contain drop-shadow-md">
        <h1 class="text-lg font-extrabold text-slate-800 tracking-tight">SMK NEGERI 1 KLATEN</h1>
        <p class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 mt-0.5">Program Keahlian Desain Komunikasi Visual (DKV)</p>
        <p class="text-[11px] text-slate-400 mt-1">Portal Presensi, Jurnal & Monitoring PKL</p>
      </div>

      <form onsubmit=" event.preventDefault(); prosesLogin(); " class="space-y-3.5">
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-600 mb-1">ID Pengguna(NIS/ID GURU)</label>
          <input type="text" id="inputNis" autocomplete="off" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-600 mb-1">PIN Keamanan</label>
          <div class="relative">
            <input type="password" id="inputPin" autocomplete="off" class="w-full px-4 py-2.5 pr-11 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition">
            <button type="button" onclick="toggleShowPin('inputPin', 'btnEyeLogin')" id="btnEyeLogin" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-indigo-600 text-sm px-1" title="Lihat / Sembunyikan PIN">👁️</button>
          </div>
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200/50 transition flex items-center justify-center gap-2">
          <span id="txtBtnLogin">Masuk Aplikasi</span>
          <svg id="spinnerLogin" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
        <div class="text-center pt-2 border-t border-slate-100">
          <p class="text-[11px] text-slate-400 font-medium">© copyright_DKV_SMKN 1 Klaten</p>
        </div>
      </form>
    </div>
  </main>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwi7JawplrCbbPJSaWfWsBcH_FfmPV4un5lruxssQqiePZ372172qepYIw163X4PKM-aQ/exec';
    const INACTIVITY_LIMIT_MS = 10 * 60 * 1000;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    function terapkanTemaAwal() {
      const isDark = localStorage.getItem('pkl_theme') === 'dark';
      document.documentElement.classList.toggle('dark', isDark);
      document.getElementById('iconDarkLogin').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('txtDarkLogin').innerText = isDark ? 'Mode Terang' : 'Mode Gelap';
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('pkl_theme', isDark ? 'dark' : 'light');
      document.getElementById('iconDarkLogin').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('txtDarkLogin').innerText = isDark ? 'Mode Terang' : 'Mode Gelap';
    }

    terapkanTemaAwal();

    function toggleShowPin(inputId, btnId) {
      const el = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (el.type === 'password') {
        el.type = 'text';
        btn.innerText = '🙈';
      } else {
        el.type = 'password';
        btn.innerText = '👁️';
      }
    }

    function arahkanSesuaiRole(role) {
      if (role === 'admin') window.location.replace('admin.html');
      else if (role === 'guru') window.location.replace('guru.html');
      else if (role === 'siswa') window.location.replace('siswa.html');
    }

    // Cek apabila sesi masih aktif
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('pkl_user');
      const lastActive = Number(localStorage.getItem('pkl_last_active') || 0);
      if (savedUser) {
        if (lastActive && (Date.now() - lastActive > INACTIVITY_LIMIT_MS)) {
          localStorage.removeItem('pkl_user');
          localStorage.removeItem('pkl_last_active');
        } else {
          try {
            const parsed = JSON.parse(savedUser);
            if (parsed && parsed.role) {
              arahkanSesuaiRole(parsed.role);
            }
          } catch (e) {
            localStorage.removeItem('pkl_user');
          }
        }
      }
    });

    async function prosesLogin() {
      const nis = document.getElementById('inputNis').value.trim();
      const pin = document.getElementById('inputPin').value.trim();
      if (!nis || !pin) return alert('Masukkan ID Pengguna dan PIN Keamanan terlebih dahulu!');

      const btn = document.getElementById('btnLogin');
      const txtBtn = document.getElementById('txtBtnLogin');
      const spinner = document.getElementById('spinnerLogin');
      
      btn.disabled = true;
      txtBtn.innerText = 'Memverifikasi...';
      spinner.classList.remove('hidden');

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', nis, pin })
        });
        const result = await res.json();

        if (result.status === 'success') {
          localStorage.setItem('pkl_user', JSON.stringify(result));
          localStorage.setItem('pkl_last_active', Date.now().toString());
          arahkanSesuaiRole(result.role);
        } else {
          alert(result.message);
        }
      } catch (e) {
        alert('Gagal terhubung ke server. Pastikan koneksi internet stabil.');
      } finally {
        btn.disabled = false;
        txtBtn.innerText = 'Masuk Aplikasi';
        spinner.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
